name: CPU validation
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1 torchaudio==2.11.0
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m mpsl.smoke
