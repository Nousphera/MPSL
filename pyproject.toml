[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsl-research"
version = "0.1.0"
description = "Multimodal parallel split learning with a shared transformer encoder"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.14.1", "torchvision==0.29.1", "numpy>=2,<3", "tqdm>=4.67,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
experiments = ["torchaudio==2.11.0", "soundfile>=0.13,<0.14", "opencv-python>=4.8,<4.12", "scikit-learn>=1.5,<2", "requests>=2.34.2,<3", "transformers==5.19.0", "einops>=0.8,<1", "timm==1.0.30", "open_clip_torch==3.3.0", "datasets==5.1.0", "pyarrow>=26,<27", "pillow>=11.3,<12", "rarfile>=4.2,<5", "av>=15,<16", "fvcore==0.1.5.post20221221"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mpsl = ["available_datasets/**/assets/**/*.txt"]
