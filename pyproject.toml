[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsl-research"
version = "0.1.0"
description = "Multimodal parallel split learning with a shared transformer encoder"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.5.1", "torchvision==0.20.1", "numpy>=1.26,<2", "tqdm>=4.67,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
experiments = ["setuptools==80.9.0", "torchaudio==2.5.1", "soundfile>=0.13,<0.14", "opencv-python>=4.8,<4.12", "scikit-learn>=1.5,<2", "requests>=2.32.4,<3", "transformers==4.39.3", "openai-clip==1.0.1", "einops>=0.8,<1", "timm==1.0.15", "open_clip_torch==2.24.0", "datasets==2.20.0", "pyarrow>=15,<21", "pillow>=10.4,<12", "rarfile>=4.2,<5", "av>=15,<16", "fvcore==0.1.5.post20221221"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mpsl = ["available_datasets/**/assets/**/*.txt"]
